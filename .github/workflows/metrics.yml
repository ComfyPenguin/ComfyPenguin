name: Metrics

on:
  schedule: # every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Palette from the portfolio ("Plano polar"). Solid panel so it reads in GitHub light and dark.
    env:
      METRICS_CSS: |
        svg { background: #060e24 !important; color: #b4cde0 !important; }
        .items-wrapper { background: transparent !important; }
        h1, h2 { color: #f0b8a0 !important; }
        h1 svg, h2 svg, .field svg { fill: #a8d4e6 !important; }
        .added { color: #7fb2cf !important; }
        footer span { color: #4f86ad !important; }
        :root {
          --color-calendar-graph-day-bg: #14294d !important;
          --color-calendar-graph-day-L1-bg: #254779 !important;
          --color-calendar-graph-day-L2-bg: #4f86ad !important;
          --color-calendar-graph-day-L3-bg: #a8d4e6 !important;
          --color-calendar-graph-day-L4-bg: #f0b8a0 !important;
        }

    steps:
      - name: Profile metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-profile.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 3
          extras_css: ${{ env.METRICS_CSS }}

      - name: Recent code
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-code.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_days: 90
          plugin_code_visibility: public
          plugin_code_skipped: ComfyPenguin/ComfyPenguin
          extras_css: ${{ env.METRICS_CSS }}

      - name: Isometric calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_padding: 10%, 1%
          extras_css: ${{ env.METRICS_CSS }}

      - name: Full-year calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-year.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
          extras_css: ${{ env.METRICS_CSS }}

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_ignored: html, css
          extras_css: ${{ env.METRICS_CSS }}

      - name: Featured repositories
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-repos.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: ComfyPenguin/andypr-portfolio
          plugin_repositories_order: featured
          extras_css: ${{ env.METRICS_CSS }}
