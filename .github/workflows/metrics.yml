name: Metrics

on:
  schedule: # every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

# One run at a time so two runs never race to write the same SVG
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Palette from the portfolio ("Plano polar"). Solid panel so it reads in GitHub light and dark.
    env:
      METRICS_CSS: |
        svg { background: #060e24 !important; color: #b4cde0 !important; }
        .items-wrapper { background: transparent !important; }
        h1, h2 { color: #f0b8a0 !important; }
        h1 svg, h2 svg, .field svg { fill: #a8d4e6 !important; }
        .added { color: #7fb2cf !important; }
        footer span { color: #4f86ad !important; }
        :root {
          --color-calendar-graph-day-bg: #14294d !important;
          --color-calendar-graph-day-L1-bg: #254779 !important;
          --color-calendar-graph-day-L2-bg: #4f86ad !important;
          --color-calendar-graph-day-L3-bg: #a8d4e6 !important;
          --color-calendar-graph-day-L4-bg: #f0b8a0 !important;
        }

    steps:
      - name: Profile metrics
        timeout-minutes: 5 # rendering sometimes hangs; fail fast instead of waiting
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-profile.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: metrics # keep bot commits off main
          base: header, activity, community, repositories, metadata
          extras_css: ${{ env.METRICS_CSS }}

      - name: Isometric calendar
        timeout-minutes: 5 # rendering sometimes hangs; fail fast instead of waiting
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: metrics # keep bot commits off main
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_padding: 10%, 1%
          extras_css: ${{ env.METRICS_CSS }}

      - name: Languages
        timeout-minutes: 5 # rendering sometimes hangs; fail fast instead of waiting
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: metrics # keep bot commits off main
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_ignored: html, css
          extras_css: ${{ env.METRICS_CSS }}
